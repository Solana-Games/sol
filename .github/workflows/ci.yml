name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  node:
    name: Node.js (Lint, Typecheck, Build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit --noUnusedLocals false --noUnusedParameters false

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SOLANA_NETWORK: devnet
          NEXT_PUBLIC_RPC_ENDPOINT: https://api.devnet.solana.com
          NEXT_PUBLIC_PROGRAM_ID: SuPeRcHaRgEdCaSiNo1111111111111111111111111
          NEXT_PUBLIC_ORACLE_API_URL: https://oracle.casino.sol/api
          NEXT_PUBLIC_ORACLE_ENABLED: "true"
          NEXT_PUBLIC_ENABLE_GAME_BUILDER: "true"
          NEXT_PUBLIC_ENABLE_ORACLE: "true"
          NEXT_PUBLIC_ENABLE_LEADERBOARD: "true"
          NEXT_PUBLIC_MIN_BET_SOL: "0.01"
          NEXT_PUBLIC_MAX_BET_SOL: "10"
          NEXT_PUBLIC_HOUSE_EDGE_BPS: "200"

  anchor:
    name: Anchor (Rust Build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Anchor program
        run: cargo build --manifest-path Cargo.toml
